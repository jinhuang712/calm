# Ink: a soft theme for Calm Terminal, in light and dark.
name = "Ink"

[dark]
background = "#1d1e20"
foreground = "#bcbec1"
cursor = "#a3b3c4"
selection = "#343537"
palette = "#323335, #c68e88, #83aa84, #ae9e6c, #81a1ca, #b88fb3, #67acac, #afb1b4, #707274, #e0a29c, #97c197, #c5b37d, #94b7e4, #d0a3cb, #78c4c3, #d3d4d7"
sidebar = "#17181a"
accent = "#89afd6"

[light]
background = "#f3f4f6"
foreground = "#4c4d4e"
cursor = "#465463"
selection = "#d8d9da"
palette = "#474849, #955954, #4d784f, #7c6a31, #4b6e99, #865b82, #227a7a, #d0d1d2, #7f8081, #844642, #3a673c, #6c5918, #385c8a, #754871, #00696a, #e7e8e9"
sidebar = "#ecedee"
accent = "#4f78a2"
