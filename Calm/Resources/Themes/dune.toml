# Dune: a soft theme for Calm Terminal, in light and dark.
name = "Dune"

[dark]
background = "#231d13"
foreground = "#c6bcad"
cursor = "#caab88"
selection = "#3b342a"
palette = "#383227, #c68e88, #83aa84, #ae9e6c, #81a1ca, #b88fb3, #67acac, #b8b0a3, #787165, #e0a29c, #97c197, #c5b37d, #94b7e4, #d0a3cb, #78c4c3, #dbd3c6"
sidebar = "#1d170e"
accent = "#c8a47a"

[light]
