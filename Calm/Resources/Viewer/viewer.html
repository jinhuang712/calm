<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Calm's file viewer (DESIGNS.md → Files and viewer): Markdown and code rendered offline with
     markdown-it and highlight.js, in the colors Calm passes in; for a changed file, its changed
     lines marked and its diff against the last commit, unified or split. -->
<style>
  :root {
    --bg: #1e1e24; --fg: #d8d8dc; --muted: #9a9aa2; --faint: #6c6c74;
    --line: rgba(255, 255, 255, 0.08); --code-bg: rgba(255, 255, 255, 0.04); --mark: rgba(214, 180, 120, 0.18);
    --added: #9cbf93; --removed: #bf9490; --modified: #92aecb;
    /* Where code starts: under the file's name in the header (Calm passes its own). */
    --gutter: 50px;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 32px 96px; }
  main.code { max-width: none; padding: 8px 0 80px; }
  h1, h2, h3, h4 { font-weight: 600; line-height: 1.3; margin: 1.6em 0 0.6em; }
  h1 { font-size: 1.7em; } h2 { font-size: 1.35em; } h3 { font-size: 1.12em; }
  h1:first-child, h2:first-child { margin-top: 0; }
  p, ul, ol, blockquote, table, pre { margin: 0 0 1em; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 2px; }
  blockquote { margin-left: 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
  hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
  code { font: 0.88em/1.5 "SF Mono", ui-monospace, Menlo, monospace; background: var(--code-bg); border-radius: 4px; padding: 0.1em 0.35em; }
  pre { background: var(--code-bg); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  pre code { background: none; padding: 0; font-size: 0.86em; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { font-weight: 600; }
  img { max-width: 100%; }

  /* Code: no line numbers; the text starts under the file's name. */
  .lines { font: 13px/1.6 "SF Mono", ui-monospace, Menlo, monospace; tab-size: 4; }
  .lines .l { display: block; position: relative; padding: 0 24px 0 var(--gutter); white-space: pre; }
  .lines .l.target { background: var(--mark); }
  /* Find (FEATURES.md → F16): Calm passes --find (the solid accent), --find-band, --find-track,
     --find-box and --find-tick (a lone tick's strength). Every match underlined, the current one
     a pill; in a code or text file its line gets the band and the edge bar. */
  mark.calm-find { background: none; color: inherit; text-decoration: underline 2px var(--find); text-underline-offset: 3px; text-decoration-skip-ink: none; }
  mark.calm-find.current { background: var(--find); color: var(--bg); border-radius: 3px; box-shadow: 0 0 0 2px var(--find); text-decoration: none; }
  .lines .l.find-band { background: var(--find-band); box-shadow: inset 3px 0 0 var(--find); }
  #calm-find-map { position: fixed; right: 3px; top: 6px; bottom: 6px; width: 8px; border-radius: 4px; background: var(--find-track); }
  #calm-find-map .tick { position: absolute; left: 1px; right: 1px; height: 2px; border-radius: 1px; background: var(--find); cursor: default; }
  #calm-find-map .tick.current { left: -2px; height: 4px; opacity: 1 !important; pointer-events: none; }
  #calm-find-map .box { position: absolute; left: 0; right: 0; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--find-box); pointer-events: none; }
  /* Changed lines: a bar beside each, and a small wedge where lines were only removed. */
  .lines .l.add::before, .lines .l.mod::before {
    content: ""; position: absolute; left: calc(var(--gutter) - 12px); top: 0; bottom: 0; width: 3px; border-radius: 1px;
  }
  .lines .l.add::before { background: var(--added); }
  .lines .l.mod::before { background: var(--modified); }
  .lines .l.cut::after, .lines .l.cut-end::after {
    content: ""; position: absolute; left: calc(var(--gutter) - 13px); top: -4px;
    border: 4px solid transparent; border-left: 6px solid var(--removed); border-right: 0;
  }
  .lines .l.cut-end::after { top: auto; bottom: -4px; }

  /* Diffs. */
  .diff { font: 13px/1.6 "SF Mono", ui-monospace, Menlo, monospace; tab-size: 4; }
  .diff .r { display: block; position: relative; padding: 0 24px 0 var(--gutter); white-space: pre; min-height: 1.6em; }
  .diff .r.del { background: color-mix(in srgb, var(--removed) 13%, transparent); }
  .diff .r.add { background: color-mix(in srgb, var(--added) 12%, transparent); }
  .diff .r.del::before, .diff .r.add::before {
    position: absolute; left: calc(var(--gutter) - 22px); width: 12px; text-align: right;
  }
  .diff .r.del::before { content: "−"; color: var(--removed); }
  .diff .r.add::before { content: "+"; color: var(--added); }
  .diff .em-del { background: color-mix(in srgb, var(--removed) 34%, transparent); border-radius: 3px; }
  .diff .em-add { background: color-mix(in srgb, var(--added) 32%, transparent); border-radius: 3px; }
  .diff .h, .diff .g {
    display: block; padding: 0 24px 0 var(--gutter); color: var(--faint);
    background: color-mix(in srgb, var(--fg) 4%, transparent);
  }
  .diff .h { white-space: pre; }
  .diff .g { font: 12px/1.75 -apple-system, BlinkMacSystemFont, sans-serif; }
  /* Split: the last commit on the left, now on the right; long lines wrap so both sides line up. */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .split .side-title {
    font: 600 11px/1 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0.06em; color: var(--faint);
    padding: 4px 0 8px var(--gutter);
  }
  .split .side-title.right, .split .r.right { padding-left: 30px; }
  .split .r { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 16px; }
  .split .r.right.del::before, .split .r.right.add::before { left: 8px; }
  .split .r.left, .split .side-title.left { box-shadow: inset -1px 0 0 var(--line); }
  .split .r.none { background: color-mix(in srgb, var(--fg) 3%, transparent); }
  .split .h, .split .g { grid-column: 1 / -1; }

  /* highlight.js, in low-saturation tones. */
  .hljs-comment, .hljs-quote { color: var(--faint); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-type { color: #b7a6d6; }
  .hljs-string, .hljs-attr, .hljs-symbol, .hljs-bullet, .hljs-addition { color: #a9c7a0; }
  .hljs-number, .hljs-literal, .hljs-variable, .hljs-template-variable { color: #d6b98c; }
  .hljs-title, .hljs-section, .hljs-name, .hljs-function { color: #9fbfd3; }
  .hljs-deletion, .hljs-meta { color: #c99a9a; }
  .hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 600; }
</style>
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/highlight.min.js"></script>
</head>
<body>
<main id="content"></main>
<script>
  const content = document.getElementById("content");
  const escape = (text) => text.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  function highlight(code, language) {
    try {
      if (language && hljs.getLanguage(language)) return hljs.highlight(code, { language, ignoreIllegals: true }).value;
      if (code.length < 200000) return hljs.highlightAuto(code).value;
    } catch (error) {}
    return escape(code);
  }

  /// Highlighted HTML cut into lines, each closing the spans still open at its end and the next
  /// reopening them, so a comment or string over several lines keeps its color on every one.
  function splitLines(html) {
    const lines = [];
    const open = [];
    let line = "";
    const pattern = /(<span[^>]*>)|(<\/span>)|([^<\n]+|<|\n)/g;
    let match;
    while ((match = pattern.exec(html)) !== null) {
      if (match[1]) {
        open.push(match[1]);
        line += match[1];
      } else if (match[2]) {
        open.pop();
        line += match[2];
      } else if (match[3] === "\n") {
        lines.push(line + "</span>".repeat(open.length));
        line = open.join("");
      } else {
        line += match[3];
      }
    }
    lines.push(line + "</span>".repeat(open.length));
    return lines;
  }

  /// Wraps the characters from `start` to `end` of `element`'s text (UTF-16 offsets, as Calm
  /// counts them) in spans of `className`, cutting through the highlight's spans as needed.
  function emphasize(element, start, end, className) {
    if (end <= start) return;
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    let offset = 0;
    for (const node of nodes) {
      const length = node.data.length;
      const from = Math.max(start - offset, 0);
      const to = Math.min(end - offset, length);
      if (from < to) {
        const middle = from > 0 ? node.splitText(from) : node;
        if (to - from < middle.data.length) middle.splitText(to - from);
        const mark = document.createElement("span");
        mark.className = className;
        middle.parentNode.insertBefore(mark, middle);
        mark.appendChild(middle);
      }
      offset += length;
    }
  }

  let doc = null;       // what Calm last asked to render
  let changes = null;   // the file's changes against the last commit, once Calm has read them
  let mode = "file";    // "file", "unified" or "split"

  function textLines(text) {
    const lines = text.split("\n");
    if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
    return lines;
  }

  function highlightedLines(text) {
    if (doc.kind === "code") return splitLines(highlight(text, doc.language));
    if (doc.kind === "markdown") return splitLines(highlight(text, "markdown"));
    return textLines(text).map(escape);
  }

  function renderFile() {
    if (doc.kind === "markdown") {
      const md = window.markdownit({ html: false, linkify: true, typographer: false, highlight: (code, lang) => highlight(code, lang) });
      content.className = "";
      content.innerHTML = md.render(doc.text);
      return;
    }
    content.className = "code";
    const lines = doc.kind === "code" ? splitLines(highlight(doc.text, doc.language)) : doc.text.split("\n").map(escape);
    const marks = changes ? changes.marks : {};
    const cuts = new Set(changes ? changes.deletions : []);
    const count = lines.length;
    content.innerHTML = `<div class="lines">${lines.map((line, index) => {
      const number = index + 1;
      const classes = ["l"];
      if (marks[number] === "added") classes.push("add");
      if (marks[number] === "modified") classes.push("mod");
      if (cuts.has(number)) classes.push("cut");
      if (number === count && cuts.has(count + 1)) classes.push("cut-end");
      return `<span class="${classes.join(" ")}">${line || " "}</span>`;
    }).join("")}</div>`;
    if (doc.line) {
      const target = content.querySelectorAll(".l")[doc.line - 1];
      if (target) {
        target.classList.add("target");
        target.scrollIntoView({ block: "center" });
      }
    }
  }

  function gap(count) {
    return count > 0 ? `<span class="g">⋯  ${count} unchanged line${count === 1 ? "" : "s"}</span>` : "";
  }

  /// The quiet rows between hunks: what's before the first, between each and after the last.
  function gaps() {
    const total = textLines(doc.text).length;
    const result = [];
    let next = 1;
    for (const hunk of changes.hunks) {
      result.push(hunk.newStart - next);
      next = hunk.newStart + hunk.newCount;
    }
    result.push(total - next + 1);
    return result;
  }

  function renderUnified() {
    const oldLines = highlightedLines(changes.oldText);
    const newLines = highlightedLines(doc.text);
    const between = gaps();
    let html = "";
    changes.hunks.forEach((hunk, index) => {
      html += gap(between[index]);
      html += `<span class="h">${escape(hunk.header)}${hunk.section ? "  " + escape(hunk.section) : ""}</span>`;
      for (const row of hunk.rows) {
        const text = row.k === "del" ? oldLines[row.o - 1] : newLines[row.n - 1];
        const kind = row.k === "ctx" ? "" : row.k;
        html += `<span class="r ${kind}" data-em="${row.em ? row.em.join(",") : ""}">${text || " "}</span>`;
      }
    });
    html += gap(between[between.length - 1]);
    content.className = "code";
    content.innerHTML = `<div class="diff">${html}</div>`;
    for (const row of content.querySelectorAll(".r[data-em]:not([data-em=''])")) {
      const [start, end] = row.dataset.em.split(",").map(Number);
      emphasize(row, start, end, row.classList.contains("del") ? "em-del" : "em-add");
    }
  }

  function renderSplit() {
    const oldLines = highlightedLines(changes.oldText);
    const newLines = highlightedLines(doc.text);
    const between = gaps();
    let html = `<div class="side-title left">LAST COMMIT</div><div class="side-title right">NOW</div>`;
    const cell = (side, line, number, kind, em) => {
      if (!line) return `<span class="r ${side} none"> </span>`;
      const text = (side === "left" ? oldLines : newLines)[number - 1];
      return `<span class="r ${side} ${kind}" data-em="${em ? em.join(",") : ""}">${text || " "}</span>`;
    };
    changes.hunks.forEach((hunk, index) => {
      html += gap(between[index]);
      html += `<span class="h">${escape(hunk.header)}${hunk.section ? "  " + escape(hunk.section) : ""}</span>`;
      for (const pair of hunk.pairs) {
        html += cell("left", pair.l, pair.l && pair.l.o, pair.l && pair.l.k, pair.l && pair.l.em);
        html += cell("right", pair.r, pair.r && pair.r.n, pair.r && pair.r.k, pair.r && pair.r.em);
      }
    });
    html += gap(between[between.length - 1]);
    content.className = "code";
    content.innerHTML = `<div class="diff split">${html}</div>`;
    for (const row of content.querySelectorAll(".r[data-em]:not([data-em=''])")) {
      const [start, end] = row.dataset.em.split(",").map(Number);
      emphasize(row, start, end, row.classList.contains("del") ? "em-del" : "em-add");
    }
  }

  function render() {
    if (!doc) return;
    if (mode !== "file" && changes) {
      mode === "split" ? renderSplit() : renderUnified();
      window.scrollTo(0, 0);
    } else {
      renderFile();
    }
    refind();
  }

  /// Called by Calm: { kind: "markdown" | "code" | "text", text, language?, line?, gutter?, colors: {…} }
  window.calmRender = function (document_) {
    for (const [name, value] of Object.entries(document_.colors || {})) {
      document.documentElement.style.setProperty(`--${name}`, value);
    }
    if (document_.gutter) {
      document.documentElement.style.setProperty("--gutter", `${document_.gutter}px`);
    }
    doc = document_;
    render();
  };

  /// Called by Calm once it has read the file's changes: { marks: {line: "added" | "modified"},
  /// deletions: [line], oldText, hunks: [{ header, section, newStart, newCount, rows, pairs }] }.
  window.calmSetChanges = function (changes_) {
    changes = changes_;
    render();
  };

  /// Called by Calm when the header's switch changes: "file", "unified" or "split".
  window.calmSetMode = function (mode_) {
    if (mode_ === mode) return;
    mode = mode_;
    render();
  };

  // Find: the field in Calm's viewer header calls these, and each returns { total, current }.
  // Rendered Markdown gets no band (its lines reflow); a click on the map's tick tells Calm.
  let finds = [];
  let current = -1;
  let map = null;
  let findWords = "";   // what find is looking for, so a redraw can look again
  let findExpression = null; // the words as a pattern, when `.*` is on

  function clearFind() {
    for (const mark of finds) {
      const parent = mark.parentNode;
      if (!parent) continue;
      parent.replaceChild(document.createTextNode(mark.textContent), mark);
      parent.normalize();
    }
    finds = [];
    current = -1;
    for (const line of content.querySelectorAll(".l.find-band")) line.classList.remove("find-band");
    if (map) {
      map.remove();
      map = null;
    }
  }

  // Where the words are in one text: case doesn't matter, as in the terminal; matches don't
  // overlap here (a mark can't). A pattern (`.*`) is JavaScript's, and one that matches nothing
  // isn't counted.
  function rangesIn(text, words, expression) {
    const found = [];
    if (expression) {
      expression.lastIndex = 0;
      let match;
      while ((match = expression.exec(text)) !== null) {
        if (match[0].length === 0) {
          expression.lastIndex++;
          continue;
        }
        found.push([match.index, match.index + match[0].length]);
      }
      return found;
    }
    const lower = text.toLowerCase();
    const needle = words.toLowerCase();
    let at = lower.indexOf(needle);
    while (at >= 0) {
      found.push([at, at + needle.length]);
      at = lower.indexOf(needle, at + needle.length);
    }
    return found;
  }

  function markAll(words, expression) {
    const nodes = [];
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const text = node.nodeValue;
      const ranges = rangesIn(text, words, expression);
      if (!ranges.length) continue;
      const fragment = document.createDocumentFragment();
      let last = 0;
      for (const [start, end] of ranges) {
        if (start > last) fragment.appendChild(document.createTextNode(text.slice(last, start)));
        const mark = document.createElement("mark");
        mark.className = "calm-find";
        mark.textContent = text.slice(start, end);
        fragment.appendChild(mark);
        finds.push(mark);
        last = end;
      }
      if (last < text.length) fragment.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(fragment, node);
    }
  }

  const findState = () => ({ total: finds.length, current: current });

  function select(index, scroll) {
    const old = finds[current];
    if (old) {
      old.classList.remove("current");
      old.closest(".l")?.classList.remove("find-band");
    }
    current = index;
    const mark = finds[index];
    if (!mark) return;
    mark.classList.add("current");
    mark.closest(".l")?.classList.add("find-band");
    if (scroll) {
      const box = mark.getBoundingClientRect();
      if (box.top < 0 || box.bottom > window.innerHeight) mark.scrollIntoView({ block: "center" });
    }
    drawMap();
  }

  function drawMap() {
    const height = document.documentElement.scrollHeight;
    if (!finds.length || height <= window.innerHeight + 1) {
      map?.remove();
      map = null;
      return;
    }
    if (!map) {
      map = document.createElement("div");
      map.id = "calm-find-map";
      document.body.appendChild(map);
      map.addEventListener("click", (event) => {
        const tick = event.target.closest(".tick");
        if (!tick) return;
        select(Number(tick.dataset.index), true);
        window.webkit?.messageHandlers?.calmFind?.postMessage(findState());
      });
    }
    const track = map.clientHeight;
    const top = (mark) => mark.getBoundingClientRect().top + window.scrollY;
    const slots = new Map();
    let ticks = "";
    finds.forEach((mark, index) => {
      const y = Math.min(Math.floor(((top(mark) / height) * track) / 2) * 2, track - 2);
      slots.set(y, (slots.get(y) || 0) + 1);
      if (slots.get(y) === 1) ticks += `<div class="tick" data-index="${index}" data-y="${y}" style="top:${y}px"></div>`;
    });
    const box = `<div class="box" style="top:${(window.scrollY / height) * track}px;height:${Math.max((window.innerHeight / height) * track, 4)}px"></div>`;
    map.innerHTML = box + ticks;
    for (const tick of map.querySelectorAll(".tick")) {
      const lines = slots.get(Number(tick.dataset.y));
      tick.style.opacity = lines >= 3 ? 0.95 : lines === 2 ? 0.78 : "var(--find-tick)";
    }
    const mark = finds[current];
    if (mark) {
      const y = (top(mark) / height) * track;
      map.insertAdjacentHTML("beforeend", `<div class="tick current" style="top:${Math.min(Math.max(y - 1, 0), track - 4)}px"></div>`);
    }
  }

  window.addEventListener("scroll", () => {
    const box = map?.querySelector(".box");
    if (box) box.style.top = `${(window.scrollY / document.documentElement.scrollHeight) * map.clientHeight}px`;
  });
  window.addEventListener("resize", () => drawMap());

  /// After the page is drawn again (the switch between the file and its diff, or the changes
  /// arriving), the old marks went with the old content: mark the words again and tell the field.
  function refind() {
    if (!findWords) return;
    finds = [];
    current = -1;
    map?.remove();
    map = null;
    markAll(findWords, findExpression);
    if (finds.length) {
      const first = finds.findIndex((mark) => mark.getBoundingClientRect().bottom >= 0);
      select(first < 0 ? 0 : first, false);
    }
    window.webkit?.messageHandlers?.calmFind?.postMessage(findState());
  }

  /// Marks `words` (a pattern when `pattern`) and makes the first match in view, or the first
  /// after it, the current one. A pattern half typed changes nothing and says so.
  window.calmFind = function (words, colors, pattern) {
    for (const [name, value] of Object.entries(colors || {})) {
      document.documentElement.style.setProperty(`--${name}`, value);
    }
    let expression = null;
    if (pattern && words) {
      try {
        expression = new RegExp(words, "gi");
      } catch (error) {
        return { total: null, current: -1, invalid: true };
      }
    }
    clearFind();
    findWords = words || "";
    findExpression = expression;
    if (!words) return findState();
    markAll(words, expression);
    if (finds.length) {
      const first = finds.findIndex((mark) => mark.getBoundingClientRect().bottom >= 0);
      select(first < 0 ? 0 : first, true);
    } else {
      drawMap();
    }
    return findState();
  };

  /// One match down (1) or up (-1); it stops at the ends, as in the terminal.
  window.calmFindStep = function (step) {
    if (finds.length) select(Math.min(Math.max(current + step, 0), finds.length - 1), true);
    return findState();
  };

  window.calmFindClose = function () {
    findWords = "";
    findExpression = null;
    clearFind();
    return findState();
  };
</script>
</body>
</html>
