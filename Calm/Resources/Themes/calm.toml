selection = "#404143"
palette = "#3e4042, #bf9490, #8ca98c, #ad9f7b, #88a3c0, #b395b0, #7aabaa, #a2a5a8, #7a7c7e, #ce9f9b, #97b697, #bbab84, #92b0cf, #c1a0bd, #82b8b7, #bbbec1"
