name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A runner is not a Mac on a desk (fewer cores, a 1x display, system events in flight), and
      # tests have failed here for that. Printed first, so such a failure is read, not guessed.
      - name: Runner
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          sw_vers
          xcodebuild -version
          swift -e 'import AppKit; for s in NSScreen.screens { print("screen \(Int(s.frame.width))x\(Int(s.frame.height)) at \(s.backingScaleFactor)x") }' || true

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Restored here and saved right after the engine builds, not left to `actions/cache`'s own
      # save at the end of the job: that one is skipped when any later step fails, so a red Test
      # step meant the engine (a 9-minute build, 39 downloads) was rebuilt on every run.
      - name: Restore GhosttyKit cache
        id: ghosttykit-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/calm/ghostty
          key: ghosttykit-${{ runner.os }}-${{ hashFiles('scripts/ghostty.env', 'scripts/ghosttykit.sh', 'scripts/ghostty-deps.py', 'scripts/ghostty-patches/*.patch', 'mise.toml') }}

      - name: Install Metal toolchain
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build GhosttyKit
        run: mise run ghosttykit

      - name: Save GhosttyKit cache
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/calm/ghostty
          key: ${{ steps.ghosttykit-cache.outputs.cache-primary-key }}

      - name: Fetch zmx
        id: zmx
        run: mise run zmx

      # From here on a red step doesn't hide the ones after it: lint, the package's tests and the
      # app's tests each report, so one run shows every failure instead of the first.
      - name: Lint
        run: mise run lint

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.zmx.outcome == 'success' }}
        run: mise run build

      - name: Test packages
        if: ${{ !cancelled() }}
        run: scripts/xcode.sh test-packages

      - name: Test app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/xcode.sh test-app
