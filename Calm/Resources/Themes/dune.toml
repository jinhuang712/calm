foreground = "#514c45"
cursor = "#684d2c"
selection = "#ddd8d1"
palette = "#4b4741, #955954, #4d784f, #7c6a31, #4b6e99, #865b82, #227a7a, #d5d0c9, #848079, #844642, #3a673c, #6c5918, #385c8a, #754871, #00696a, #ece7e0"
