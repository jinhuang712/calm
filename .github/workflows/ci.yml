name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Restored here and saved right after the engine builds, not left to `actions/cache`'s own
      # save at the end of the job: that one is skipped when any later step fails, so a red Test
      # step meant the engine (a 9-minute build, 39 downloads) was rebuilt on every run.
      - name: Restore GhosttyKit cache
        id: ghosttykit-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/calm/ghostty
          key: ghosttykit-${{ runner.os }}-${{ hashFiles('scripts/ghostty.env', 'scripts/ghosttykit.sh', 'scripts/ghostty-deps.py', 'scripts/ghostty-patches/*.patch', 'mise.toml') }}

      - name: Install Metal toolchain
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build GhosttyKit
        run: mise run ghosttykit

      - name: Save GhosttyKit cache
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/calm/ghostty
          key: ${{ steps.ghosttykit-cache.outputs.cache-primary-key }}

      - name: Fetch zmx
        run: mise run zmx

      - name: Lint
        run: mise run lint

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test
